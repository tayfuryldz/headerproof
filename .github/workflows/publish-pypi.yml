name: Publish PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Python distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${DISPATCH_TAG:-${RELEASE_TAG:-}}"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Expected a vMAJOR.MINOR.PATCH tag, got: $TAG" >&2; exit 2 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build==1.3.0"
          python -m build
      - name: Verify distribution version
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python - <<'PY'
          import glob
          import os
          import zipfile

          expected = os.environ["EXPECTED_VERSION"]
          wheels = glob.glob("dist/headerproof-*.whl")
          if len(wheels) != 1:
              raise SystemExit(f"expected one wheel, got {wheels}")
          with zipfile.ZipFile(wheels[0]) as archive:
              metadata = next(name for name in archive.namelist() if name.endswith("/METADATA"))
              text = archive.read(metadata).decode()
          if f"Version: {expected}\n" not in text:
              raise SystemExit(f"wheel metadata does not match tag version {expected}")
          print(f"verified HeaderProof {expected}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-dist-${{ steps.release.outputs.tag }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish trusted distribution
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/headerproof/
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: python-dist-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
